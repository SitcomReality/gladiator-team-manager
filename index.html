<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gladiator Team Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/visualization.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🏛️ Gladiator Team Manager</h1>
            <div class="resources">
                <div class="resource">
                    <span class="icon">💰</span>
                    <span id="gold">500</span> Gold
                </div>
                <div class="resource">
                    <span class="icon">⚔️</span>
                    <span id="reputation">0</span> Reputation
                </div>
            </div>
        </header>

        <main>
            <div class="game-container">
                <div class="left-panel">
                    <div class="panel">
                        <h2>Your Gladiators</h2>
                        <button id="recruit-btn" class="btn primary">Recruit New Gladiator (100g)</button>
                        <div id="gladiator-roster"></div>
                    </div>
                </div>

                <div class="center-panel">
                    <div class="panel">
                        <h2>Arena</h2>
                        <div id="battle-selection">
                            <h3>Available Battles</h3>
                            <div id="battle-options"></div>
                        </div>
                        <div id="battle-setup" style="display: none;">
                            <h3>Select Your Team</h3>
                            <div id="team-selection"></div>
                            <button id="start-battle-btn" class="btn primary">Enter the Arena!</button>
                            <button id="cancel-battle-btn" class="btn secondary">Cancel</button>
                        </div>
                        <div id="battle-results" style="display: none;">
                            <h3>Battle Results</h3>
                            <div id="battle-arena-container">
                                <canvas id="battle-canvas" width="800" height="400"></canvas>
                            </div>
                            <div id="results-content"></div>
                            <button id="continue-btn" class="btn primary">Continue</button>
                        </div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="panel">
                        <h2>Gladiator Details</h2>
                        <div id="gladiator-details">
                            <p>Select a gladiator to view details</p>
                        </div>
                    </div>
                    <div class="panel">
                        <h2>Medical Bay</h2>
                        <div id="medical-bay">
                            <p>Injured gladiators will appear here</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.158.0",
            "nipplejs": "https://esm.sh/nipplejs"
        }
    }
    </script>
    <script type="module" src="gladiator/index.js"></script>
    <script type="module" src="battle/index.js"></script>
    <script src="ui/ui-manager.js"></script>
    <script src="ui/components/gladiator-roster.js"></script>
    <script src="ui/components/gladiator-details.js"></script>
    <script src="ui/components/medical-bay.js"></script>
    <script src="ui/components/battle-selection.js"></script>
    <script src="ui/components/battle-setup.js"></script>
    <script src="ui/components/battle-results.js"></script>
    <script type="module" src="ui/battle-visualization.js"></script>
    <script src="game.js"></script>
</body>
</html>
